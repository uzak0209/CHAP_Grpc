services:
  backend-server:
    build:
      context: ./backend
      dockerfile: Dockerfile.typescript
    ports:
      - "8081:8081"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app:delegated
      - /app/node_modules
    networks:
      - grpc-network
    restart: "no"
    environment:
      - PORT=8081
      - DB_DSN=postgresql://postgres@postgres:5432/chapdb?sslmode=disable
  swagger-ui:
    build:
      context: ./docs
      dockerfile: Dockerfile.swagger
    ports:
      - "3000:8080"
    environment:
      - SWAGGER_JSON=/swagger.json
    networks:
      - grpc-network
  postgres:
    image: postgres:15
    container_name: chap_postgres
    restart: always
    environment:
      POSTGRES_DB: chapdb
      # Allow host connections without a password (trust). This makes local dev easier.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      grpc-network:
        aliases:
          - db
  adminer:
    image: adminer
    container_name: chap_adminer
    restart: always
    ports:
      - "8082:8080"
    depends_on:
      - postgres
    networks:
      - grpc-network
networks:
  grpc-network:
    driver: bridge

volumes:
  pgdata:
